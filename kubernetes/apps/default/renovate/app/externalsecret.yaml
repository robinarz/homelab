---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  refreshInterval: 1h
  target:
    name: renovate-secret
  data:
    # GitHub PAT (classic: repo scope; or fine-grained: Contents RW + PRs RW on
    # robinarz/homelab). Renovate authenticates to github.com with this.
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: RENOVATE_TOKEN
