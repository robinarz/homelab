---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
spec:
  chartRef:
    kind: OCIRepository
    name: renovate
  interval: 1h
  values:
    controllers:
      renovate:
        type: cronjob
        cronjob:
          # Daily; Renovate's own limits (prConcurrentLimit/prHourlyLimit in
          # .github/renovate.json5) keep PR noise down.
          schedule: "0 2 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 0
        containers:
          app:
            image:
              repository: ghcr.io/renovatebot/renovate
              tag: 44.34.3
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              RENOVATE_PLATFORM: github
              RENOVATE_AUTODISCOVER: "false"
              RENOVATE_REPOSITORIES: '["robinarz/homelab"]'
              # Config already committed at .github/renovate.json5 -> skip onboarding PR.
              RENOVATE_ONBOARDING: "false"
              RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@robinho.io>"
              RENOVATE_BASE_DIR: /tmp/renovate
            envFrom:
              - secretRef:
                  name: renovate-secret
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1536Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
