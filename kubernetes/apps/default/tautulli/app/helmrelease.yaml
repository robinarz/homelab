---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tautulli
spec:
  chartRef: { kind: OCIRepository, name: tautulli }
  interval: 1h
  values:
    controllers:
      tautulli:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/tautulli
              tag: 2.17.2
            env:
              TZ: ${TIMEZONE}
              TAUTULLI_HTTP_PORT: &port 80
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 10m }
              limits: { memory: 1Gi }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports: { http: { port: *port } }
    route:
      app:
        hostnames: ["tautulli.${DOMAIN}"]
        parentRefs:
          - { name: envoy-internal, namespace: network }
    persistence:
      config: { storageClass: local-path, accessMode: ReadWriteOnce, size: 2Gi }
      tmp: { type: emptyDir }
