---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  targetNamespace: default
  interval: 1h
  path: ./kubernetes/apps/default/home-assistant/app
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
