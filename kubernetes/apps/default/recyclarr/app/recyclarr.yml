# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Quality profiles + custom formats synced from TRaSH Guides via Recyclarr
# include templates (https://recyclarr.dev). Profiles created in the *arr apps:
#
#   Radarr  → "UHD Bluray + WEB"                 4K movies, English
#   Sonarr  → "WEB-2160p"                        4K series, English
#           → "[French VOSTFR] ... (2160p)"      anime: original (JP) audio + FR subs, 4K
#           → "[French VOSTFR] ... (1080p)"      anime: same, 1080p (4K anime is rare)
#
# After the first sync, assign the right profile per movie/series in the *arr UI.

radarr:
  main:
    base_url: http://radarr.default.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    include:
      # 4K high-end: Bluray-2160p + WEB-2160p (English-oriented)
      - template: uhd-bluray-web

sonarr:
  main:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    include:
      # 4K series (WEB-2160p, English-oriented)
      - template: web-2160p
      # Anime — Japanese audio + French subtitles (VOSTFR)
      - template: french-vostfr-bluray-web-2160p
      - template: french-vostfr-bluray-web-1080p
