# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.7.1/schemas/config-schema.json
#
# Quality profiles synced from TRaSH Guides. Specifying a quality profile by
# trash_id makes Recyclarr create the profile AND all of its recommended custom
# formats with the correct scores. Instance names MUST be globally unique across
# all services (movies / series), otherwise Recyclarr rejects the whole config.
#
#   Radarr "movies" → "Remux + Bluray + WEB"              4K movies: Remux + Blu-ray + WEB
#   Sonarr "series" → "WEB-2160p"                         4K series (English)
#                   → "[French VOSTFR] UHD Bluray + WEB (2160p)"  anime: JP audio + FR subs, 4K
#                   → "[French VOSTFR] HD Bluray + WEB (1080p)"   anime: JP audio + FR subs, 1080p
#
# After the first sync, assign the right profile per movie/series in the *arr UI.

radarr:
  movies:
    base_url: http://radarr.default.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d310673359205736b4b84acd5ea8c8 # Remux + Bluray + WEB (2160p combined)
        reset_unmatched_scores:
          enabled: true

sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p (4K series)
        reset_unmatched_scores:
          enabled: true
      - trash_id: d6252dce6af535107ed4b03e68052ae8 # [French VOSTFR] UHD Bluray + WEB (2160p) — anime 4K
        reset_unmatched_scores:
          enabled: true
      - trash_id: b34c968f58433a38e0e690d42a1dc37e # [French VOSTFR] HD Bluray + WEB (1080p) — anime 1080p
        reset_unmatched_scores:
          enabled: true
