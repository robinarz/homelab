# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Quality profiles + custom formats from TRaSH Guides (self-contained; trash_ids
# taken from the recyclarr config templates). Profiles created in the *arr apps:
#
#   Radarr  → "UHD Bluray + WEB"                    4K movies, English
#   Sonarr  → "WEB-2160p"                           4K series, English
#           → "[French VOSTFR] UHD Bluray+WEB 2160p" anime: original (JP) audio + FR subs, 4K
#           → "[French VOSTFR] HD Bluray+WEB 1080p"  anime: same, 1080p (4K anime is rare)
#
# After the first sync, assign the right profile per movie/series in the *arr UI.

radarr:
  main:
    base_url: http://radarr.default.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d # Golden Rule UHD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # Unwanted Formats
        - trash_id: 9d5acd8f1da78dfbae788182f7605200 # Audio Formats
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46 # HDR Formats
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028 # Streaming Services General

sonarr:
  main:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p (4K series)
        reset_unmatched_scores:
          enabled: true
      - trash_id: d6252dce6af535107ed4b03e68052ae8 # [French VOSTFR] UHD Bluray + WEB (2160p) — anime 4K
        reset_unmatched_scores:
          enabled: true
      - trash_id: b34c968f58433a38e0e690d42a1dc37e # [French VOSTFR] HD Bluray + WEB (1080p) — anime 1080p
        reset_unmatched_scores:
          enabled: true
    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # Golden Rule UHD
        - trash_id: 158188097a58d7687dee647e04af0da3 # Golden Rule HD
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # Unwanted Formats
        - trash_id: a23c8675c79118544fd74153394fa589 # Unwanted Formats French
        - trash_id: 85fae4a2294965b75710ef2989c850eb # HDR Formats
        - trash_id: 59c3af66780d08332fdc64e68297098f # Streaming Services General
        - trash_id: 7e1724c5da59e7474803ad25be98f6a3 # Audio Formats
        - trash_id: abe720fab2d27682adc2a735136cec02 # Miscellaneous
