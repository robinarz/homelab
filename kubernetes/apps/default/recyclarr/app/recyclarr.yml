# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Quality profiles synced from TRaSH Guides. Specifying a quality profile by
# trash_id makes Recyclarr create the profile AND all of its recommended custom
# formats with the correct scores. Profiles created in the *arr apps:
#
#   Radarr  → "UHD Bluray + WEB"                     4K movies, English
#   Sonarr  → "WEB-2160p"                            4K series, English
#           → "[French VOSTFR] UHD Bluray + WEB (2160p)"  anime: JP audio + FR subs, 4K
#           → "[French VOSTFR] HD Bluray + WEB (1080p)"   anime: JP audio + FR subs, 1080p
#
# After the first sync, assign the right profile per movie/series in the *arr UI.

radarr:
  main:
    base_url: http://radarr.default.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB (4K movies)

sonarr:
  main:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series
    quality_profiles:
      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p (4K series)
      - trash_id: d6252dce6af535107ed4b03e68052ae8 # [French VOSTFR] UHD Bluray + WEB (2160p) — anime 4K
      - trash_id: b34c968f58433a38e0e690d42a1dc37e # [French VOSTFR] HD Bluray + WEB (1080p) — anime 1080p
