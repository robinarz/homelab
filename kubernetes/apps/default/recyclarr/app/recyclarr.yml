# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/refs/tags/v8.7.1/schemas/config-schema.json
#
# Profiles created in the *arr apps:
#   Radarr "movies" → "Remux 2160p (Combined)"       4K movies: Remux + Blu-ray + WEB (English)
#   Sonarr "series" → "TV Blu-ray+WEB (2160p→1080p)"  prefer 4K (Blu-ray>WEB), fall back to 1080p (Blu-ray>WEB)
#                   → "[French VOSTFR] HD Bluray + WEB (1080p)"  anime: JP audio + FR subs, 1080p
#
# Instance names MUST be globally unique across services (movies / series).

radarr:
  movies:
    base_url: http://radarr.default.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      folder: plex-imdb
      movie:
        rename: true
        standard: plex-imdb
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: d1d310673359205736b4b84acd5ea8c8 # Remux + Bluray + WEB (2160p combined)
        reset_unmatched_scores:
          enabled: true

sonarr:
  series:
    base_url: http://sonarr.default.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true
    replace_existing_custom_formats: true
    media_management:
      propers_and_repacks: do_not_prefer
    media_naming:
      episodes:
        anime: default
        daily: default
        rename: true
        standard: default
      season: default
      series: plex-imdb
    quality_definition:
      type: series
    quality_profiles:
      # Custom: prefer 4K (Blu-ray > WEB), fall back to 1080p (Blu-ray > WEB).
      # min_format_score 0 + no custom formats = permissive, grabs the best
      # available resolution/source without over-strict filtering.
      - name: TV Bluray+WEB (2160p to 1080p)
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
      # Anime: original (Japanese) audio + French subtitles, 1080p
      - trash_id: b34c968f58433a38e0e690d42a1dc37e # [French VOSTFR] HD Bluray + WEB (1080p)
        reset_unmatched_scores:
          enabled: true
