---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  chartRef: { kind: OCIRepository, name: sabnzbd }
  interval: 1h
  values:
    controllers:
      sabnzbd:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: 5.1.0
            env:
              TZ: ${TIMEZONE}
              SABNZBD__PORT: &port 80
              SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd.${DOMAIN}
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 50m }
              limits: { memory: 8Gi }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports: { http: { port: *port } }
    route:
      app:
        hostnames: ["sabnzbd.${DOMAIN}"]
        parentRefs:
          - { name: envoy-internal, namespace: network }
    persistence:
      config: { storageClass: local-path, accessMode: ReadWriteOnce, size: 5Gi }
      media:
        type: nfs
        server: ${NAS_ADDR}
        path: ${NAS_MEDIA_PATH}
        globalMounts: [{ path: /data }]
      tmp: { type: emptyDir }
