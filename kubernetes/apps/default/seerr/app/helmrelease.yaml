---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  chartRef: { kind: OCIRepository, name: seerr }
  interval: 1h
  values:
    controllers:
      seerr:
        containers:
          app:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.4.1
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              PORT: &port 80
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 10m }
              limits: { memory: 2Gi }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports: { http: { port: *port } }
    route:
      app:
        hostnames: ["seerr.${DOMAIN}", "requests.${DOMAIN}"]
        parentRefs:
          - { name: envoy-internal, namespace: network }
    persistence:
      config:
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts: [{ path: /app/config }]
      tmp: { type: emptyDir }
