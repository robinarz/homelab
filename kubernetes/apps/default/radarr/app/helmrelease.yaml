---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 1h
  values:
    controllers:
      radarr:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.1.10545
            env:
              TZ: ${TIMEZONE}
              RADARR__APP__INSTANCENAME: radarr
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__SERVER__PORT: &port 80
            envFrom:
              - secretRef:
                  name: radarr-secret
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 50m, memory: 256Mi }
              limits: { memory: 2Gi }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["radarr.${DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
      media:
        type: nfs
        server: ${NAS_ADDR}
        path: ${NAS_MEDIA_PATH}
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
