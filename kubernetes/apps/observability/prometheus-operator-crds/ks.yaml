---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  targetNamespace: observability
  interval: 1h
  path: ./kubernetes/apps/observability/prometheus-operator-crds/app
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
