---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: promtail
  namespace: flux-system
spec:
  targetNamespace: observability
  interval: 1h
  timeout: 10m
  path: ./kubernetes/apps/observability/promtail/app
  prune: true
  wait: false
  dependsOn:
    - name: loki
  sourceRef:
    kind: GitRepository
    name: flux-system
