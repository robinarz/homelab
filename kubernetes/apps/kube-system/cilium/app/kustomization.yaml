---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
  - ./helmrelease.yaml
  - ./loadbalancer.yaml
# The same values file is consumed by the bootstrap helmfile, keeping a single
# source of truth for the Cilium configuration.
configMapGenerator:
  - name: cilium-values
    files:
      - values.yaml=./helm/values.yaml
generatorOptions:
  disableNameSuffixHash: true
