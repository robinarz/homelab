---
# Namespaces / app groups reconciled by the `cluster-apps` Flux Kustomization.
# Add more namespaces here as services are introduced (network, storage, media, ...).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kube-system
  - ./cert-manager
  - ./storage
  - ./network
  - ./default
  - ./external-secrets
  - ./observability
