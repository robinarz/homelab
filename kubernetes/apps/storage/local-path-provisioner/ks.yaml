---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  targetNamespace: storage
  interval: 1h
  path: ./kubernetes/apps/storage/local-path-provisioner/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
