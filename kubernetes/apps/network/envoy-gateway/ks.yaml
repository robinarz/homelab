---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  targetNamespace: network
  interval: 1h
  path: ./kubernetes/apps/network/envoy-gateway/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
