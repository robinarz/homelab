---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: newt
  namespace: flux-system
spec:
  targetNamespace: network
  interval: 1h
  path: ./kubernetes/apps/network/newt/app
  prune: true
  wait: false
  dependsOn:
    - name: gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
        optional: true
