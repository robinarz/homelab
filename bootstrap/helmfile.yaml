---
# Pre-Flux bootstrap: install the CNI (so nodes become Ready) and Flux itself.
# Once Flux is running it takes over and reconciles everything from git.
#
# Run via:  task bootstrap:apps
helmDefaults:
  timeout: 600
  wait: true
  waitForJobs: true
  force: false

repositories:
  - name: cilium
    url: https://helm.cilium.io

releases:
  # 1) CNI — shares its values with the Flux HelmRelease (single source of truth).
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.0 # keep in sync with the Flux HelmRelease
    values:
      - ../kubernetes/apps/kube-system/cilium/app/helm/values.yaml

  # 2) Flux Operator — manages the lifecycle of the Flux controllers.
  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.58.0
    createNamespace: true

  # 3) Flux Instance — deploys the controllers and points them at this repo.
  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.58.0
    needs:
      - flux-system/flux-operator
    values:
      - ./flux-instance.values.yaml
