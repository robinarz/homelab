---
# FluxInstance: which controllers to run and where to sync from.
instance:
  distribution:
    # renovate: datasource=github-releases depName=fluxcd/flux2
    version: "2.9.4"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
  sync:
    kind: GitRepository
    url: https://github.com/robinarz/homelab
    ref: refs/heads/main
    path: kubernetes/flux/config
