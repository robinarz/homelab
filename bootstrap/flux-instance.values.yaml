---
# FluxInstance: which controllers to run and where to sync from.
instance:
  distribution:
    version: "2.9.4"
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
  sync:
    kind: GitRepository
    # TODO: push this repo to GitHub and set the URL (SSH or HTTPS).
    url: https://github.com/GITHUB_USER/homelab
    ref: refs/heads/main
    path: kubernetes/flux/config
